<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Roadmap</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Dark Tech Aesthetic */
            --bg: #0a0a0a;
            --surface: #121212;
            --surface-hover: #18181b;
            --border: #27272a;
            --border-hover: #3f3f46;
            
            --text-primary: #ededed;
            --text-secondary: #a1a1aa;
            
            --accent: #0070f3;
            --accent-hover: #0051a8;
            --success: #10b981;
            
            --radius-sm: 4px;
            --radius-md: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: 48px 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            margin-bottom: 64px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .header p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* Week Section */
        .week-section {
            margin-bottom: 48px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--surface);
            overflow: hidden;
        }

        .week-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
        }

        .week-title {
            font-size: 0.9375rem;
            font-weight: 500;
        }

        .week-dates {
            font-family: 'Geist Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Tasks List */
        .task-list {
            list-style: none;
        }

        /* Task Item (Drag & Drop, Delete) */
        .task-item {
            display: flex;
            align-items: flex-start;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            transition: background-color 0.15s ease;
            position: relative;
            background: var(--surface);
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-item:hover {
            background-color: var(--surface-hover);
        }
        
        .task-item.dragging {
            opacity: 0.5;
            background: var(--surface-hover);
        }

        .task-item.drag-over {
            border-top: 2px solid var(--accent);
        }


        .task-actions {
            opacity: 0;
            display: flex;
            gap: 4px;
            align-items: center;
            transition: opacity 0.15s;
            margin-left: 12px;
        }
        
        .task-actions.has-link {
            opacity: 1;
        }

        .task-item:hover .task-actions {
            opacity: 1;
        }

        .action-icon {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .action-icon:hover {
            color: var(--text-primary);
            background: var(--surface-hover);
        }

        .action-icon.external-link {
            color: var(--accent);
        }
        
        .action-icon.external-link:hover {
            background: rgba(0, 112, 243, 0.1);
        }
        
        .action-icon.delete-btn-new {
            color: #ef4444;
        }
        .action-icon.delete-btn-new:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        

        /* Action Buttons */
        .header-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--surface-hover);
            border-color: var(--text-secondary);
        }
        
        .btn.active {
            background: var(--text-primary);
            color: var(--bg);
            border-color: var(--text-primary);
        }

        .add-btn {
            background: transparent;
            border: 1px dashed var(--border);
            border-width: 1px 0 0 0;
            color: var(--text-secondary);
            width: 100%;
            padding: 12px;
            border-radius: 0;
            text-align: left;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .add-btn:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
        }
        
        /* Focus Mode */
        body.focus-mode .week-section {
            display: none;
        }
        body.focus-mode .week-section.focused-week {
            display: block;
        }
        body.focus-mode .task-item {
            display: none;
        }
        body.focus-mode .task-item.focused-task {
            display: flex;
            border: 1px solid var(--accent);
            border-radius: var(--radius-md);
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(0, 112, 243, 0.15);
            background: var(--surface);
            margin: 16px;
        }
        body.focus-mode .add-btn {
            display: none;
        }

        /* Checkbox */
        .checkbox-cell {
            flex-shrink: 0;
            padding-right: 16px;
            padding-top: 2px;
        }

        .custom-checkbox {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid var(--border-hover);
            border-radius: var(--radius-sm);
            background-color: transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.15s ease;
            outline: none;
        }

        .custom-checkbox:hover {
            border-color: var(--text-secondary);
        }

        .custom-checkbox:checked {
            background-color: var(--text-primary);
            border-color: var(--text-primary);
        }

        .custom-checkbox:focus-visible {
            box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
        }

        .custom-checkbox:checked::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 5px;
            width: 4px;
            height: 8px;
            border: solid var(--bg);
            border-width: 0 1.5px 1.5px 0;
            transform: rotate(45deg);
        }

        /* Task Content */
        .task-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .task-day {
            font-family: 'Geist Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .task-text {
            font-size: 0.875rem;
            color: var(--text-primary);
            outline: none;
            padding: 2px 4px;
            margin: -2px -4px;
            border-radius: var(--radius-sm);
            transition: background-color 0.15s ease;
            line-height: 1.6;
        }

        .task-text:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .task-text:focus {
            background-color: var(--bg);
            box-shadow: inset 0 0 0 1px var(--border-hover);
        }

        /* Completed State */
        .task-item.completed .task-text {
            color: var(--text-secondary);
            text-decoration: line-through;
        }
        
        /* Progress */
        .progress-section {
            padding: 16px 20px;
            background: var(--bg);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .progress-track {
            flex-grow: 1;
            height: 4px;
            background-color: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--text-primary);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-stats {
            font-family: 'Geist Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            min-width: 48px;
            text-align: right;
        }

        @media (max-width: 640px) {
            body { padding: 24px 16px; }
            .week-header { flex-direction: column; align-items: flex-start; gap: 4px; }
        }
    </style>
</head>

    async function init() {
        document.getElementById('app-root').innerHTML = '<div style="padding: 20px; text-align: center;">Підключення до бази даних...</div>';
        
        try {
            const { data, error } = await supabaseClient.from('tasks_state').select('state').eq('id', 1).single();

                state = data.state;
                if (!state.backend) {

                        week: w.week,
                        title: w.title,
                        dates: w.dates,
                        tasks: []
                    }));
                }
            } else {
                // Fallback / Initial setup
                const saved = localStorage.getItem('mpmek_schedule_v4');
                const savedV3 = localStorage.getItem('mpmek_frontend_schedule_v3');
                
                if (saved) {
                    state = JSON.parse(saved);
                } else {
                    state.frontend = savedV3 ? JSON.parse(savedV3) : JSON.parse(JSON.stringify(defaultData));
                    state.backend = defaultData.map(w => ({
                        week: w.week,
                        title: w.title,
                        dates: w.dates,
                        tasks: []
                    }));
                }
                
                // Upload initial state to DB
                await supabaseClient.from('tasks_state').upsert({ id: 1, state: state });
            }
        } catch (err) {
            console.error("Database connection error:", err);
            // Fallback to local
            const saved = localStorage.getItem('mpmek_schedule_v4');
            if (saved) state = JSON.parse(saved);
        }

        render();

        // Subscribe to real-time changes
        supabaseClient.channel('custom-all-channel')
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'tasks_state' },
            (payload) => {

                  // but since we only have state, we compare a lightweight version or just store last stringified
                  const newStateStr = JSON.stringify(payload.new.state);
                  if (newStateStr !== window._lastSavedStateStr) {
                      window._lastSavedStateStr = newStateStr;
                      state = payload.new.state;
                      
                      // Check if user is typing
                      const activeEl = document.activeElement;
                      const isTyping = activeEl && activeEl.isContentEditable;
                      
                      if (!isTyping) {
                          render();
                          if (isFocusMode) applyFocusMode();
                      } else {
                          window._pendingRender = true;
                      }
                  }
              }
            }
          )
          .subscribe();
    }

    let saveTimeout;
    window._lastSavedStateStr = "";
    async function save() {
        // Optimistic local update
        const stateStr = JSON.stringify(state);
        localStorage.setItem('mpmek_schedule_v4', stateStr);
        window._lastSavedStateStr = stateStr;
        updateAllProgress();
        
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(async () => {
            // Save to DB
            const { error } = await supabaseClient.from('tasks_state').update({ state: state }).eq('id', 1);
            if (error) {
                console.error('Error saving state:', error);
            }
        }, 500);
    }


    function escapeHtml(unsafe) {
        if (!unsafe) return '';
        return unsafe
             .toString()
             .replace(/&/g, "&amp;")
             .replace(/</g, "&lt;")
             .replace(/>/g, "&gt;")
             .replace(/"/g, "&quot;")
             .replace(/'/g, "&#039;");
    }


    function renderWeek(wIdx) {
        const week = state[activeTab][wIdx];
        const section = document.getElementById(`week-${wIdx}`);
        if (!section) return render(); // Fallback

        const percent = calcProgress(week);

        let html = `
            <div class="week-header">
                <h2 class="week-title">Тиждень ${week.week}<span contenteditable="true" spellcheck="false" onblur="updateWeekTitle(${wIdx}, this.innerText)">${week.title ? ': ' + escapeHtml(week.title.replace(/^:\s*/, '')) : ''}</span></h2>
                <span class="week-dates" contenteditable="true" spellcheck="false" onblur="updateWeekDates(${wIdx}, this.innerText)">${escapeHtml(week.dates)}</span>
            </div>
            <ul class="task-list">
        `;

        week.tasks.forEach((task, tIdx) => {
            html += `
                <li class="task-item ${task.done ? 'completed' : ''}" id="task-${wIdx}-${tIdx}"
                    draggable="true" 
                    ondragstart="handleDragStart(event, ${wIdx}, ${tIdx})"
                    ondragend="handleDragEnd(event)"
                    ondragover="handleDragOver(event)"
                    ondragleave="handleDragLeave(event)"
                    ondrop="handleDrop(event, ${wIdx}, ${tIdx})">
                    
                    <div class="checkbox-cell">
                        <input type="checkbox" class="custom-checkbox" 
                               ${task.done ? 'checked' : ''} 
                               onchange="toggle(${wIdx}, ${tIdx}, this.checked)">
                    </div>
                    <div class="task-content">
                        <span class="task-day" contenteditable="true" spellcheck="false" 
                              onblur="updateDay(${wIdx}, ${tIdx}, this.innerText)">${escapeHtml(task.day)}</span>
                        <div class="task-text" contenteditable="true" spellcheck="false"
                             onblur="updateText(${wIdx}, ${tIdx}, this.innerText)">${escapeHtml(task.text)}</div>
                    </div>
                    <div class="task-actions ${task.link ? 'has-link' : ''}">
                        ${task.link ? `<a href="${escapeHtml(task.link)}" target="_blank" class="action-icon external-link" title="Відкрити посилання"><svg width="16" height="16"><use href="#icon-link"></use></svg></a>` : ''}
                        <button class="action-icon edit-link-btn" onclick="copyTask(${wIdx}, ${tIdx})" title="Копіювати текст задачі"><svg width="14" height="14"><use href="#icon-copy"></use></svg></button>
                        <button class="action-icon edit-link-btn" onclick="editLink(${wIdx}, ${tIdx})" title="Додати/змінити посилання"><svg width="14" height="14"><use href="#icon-edit"></use></svg></button>
                        <button class="action-icon delete-btn-new" onclick="deleteTask(${wIdx}, ${tIdx})" title="Видалити задачу">
                            <svg width="16" height="16"><use href="#icon-delete"></use></svg>
                        </button>
                    </div>
                </li>
            `;
        });

        html += `
            </ul>
            <button class="add-btn" onclick="addTask(${wIdx})">+ Додати задачу</button>
            <div class="progress-section">
                <div class="progress-track">
                    <div class="progress-fill" id="fill-${wIdx}" style="width: ${percent}%"></div>
                </div>
                <div class="progress-stats" id="stat-${wIdx}">${percent}%</div>
            </div>
        `;

        section.innerHTML = html;
    }

    function render() {
        const root = document.getElementById('app-root');
        root.innerHTML = '';

        state[activeTab].forEach((week, wIdx) => {
            const section = document.createElement('section');
            section.className = 'week-section';
            section.id = `week-${wIdx}`;

            const percent = calcProgress(week);

            let html = `
                <div class="week-header">
                    <h2 class="week-title">Тиждень ${week.week}<span contenteditable="true" spellcheck="false" onblur="updateWeekTitle(${wIdx}, this.innerText)">${week.title ? ': ' + escapeHtml(week.title.replace(/^:\s*/, '')) : ''}</span></h2>
                    <span class="week-dates" contenteditable="true" spellcheck="false" onblur="updateWeekDates(${wIdx}, this.innerText)">${escapeHtml(week.dates)}</span>
                </div>
                <ul class="task-list">
            `;

            week.tasks.forEach((task, tIdx) => {
                html += `
                    <li class="task-item ${task.done ? 'completed' : ''}" id="task-${wIdx}-${tIdx}"
                        draggable="true" 
                        ondragstart="handleDragStart(event, ${wIdx}, ${tIdx})"
                        ondragend="handleDragEnd(event)"
                        ondragover="handleDragOver(event)"
                        ondragleave="handleDragLeave(event)"
                        ondrop="handleDrop(event, ${wIdx}, ${tIdx})">
                        
                        <div class="checkbox-cell">
                            <input type="checkbox" class="custom-checkbox" 
                                   ${task.done ? 'checked' : ''} 
                                   onchange="toggle(${wIdx}, ${tIdx}, this.checked)">
                        </div>
                        <div class="task-content">
                            <span class="task-day" contenteditable="true" spellcheck="false" 
                                  onblur="updateDay(${wIdx}, ${tIdx}, this.innerText)">${escapeHtml(task.day)}</span>
                            <div class="task-text" contenteditable="true" spellcheck="false"
                                 onblur="updateText(${wIdx}, ${tIdx}, this.innerText)">${escapeHtml(task.text)}</div>
                        </div>
                        <div class="task-actions ${task.link ? 'has-link' : ''}">
                            ${task.link ? `<a href="${escapeHtml(task.link)}" target="_blank" class="action-icon external-link" title="Відкрити посилання"><svg width="16" height="16"><use href="#icon-link"></use></svg></a>` : ''}
                            <button class="action-icon edit-link-btn" onclick="copyTask(${wIdx}, ${tIdx})" title="Копіювати текст задачі"><svg width="14" height="14"><use href="#icon-copy"></use></svg></button>
                            <button class="action-icon edit-link-btn" onclick="editLink(${wIdx}, ${tIdx})" title="Додати/змінити посилання"><svg width="14" height="14"><use href="#icon-edit"></use></svg></button>
                            <button class="action-icon delete-btn-new" onclick="deleteTask(${wIdx}, ${tIdx})" title="Видалити задачу">
                                <svg width="16" height="16"><use href="#icon-delete"></use></svg>
                            </button>
                        </div>
                    </li>
                `;
            });

            html += `
                </ul>
                <button class="add-btn" onclick="addTask(${wIdx})">+ Додати задачу</button>
                <div class="progress-section">
                    <div class="progress-track">
                        <div class="progress-fill" id="fill-${wIdx}" style="width: ${percent}%"></div>
                    </div>
                    <div class="progress-stats" id="stat-${wIdx}">${percent}%</div>
                </div>
            `;

            section.innerHTML = html;
            root.appendChild(section);
        });
    }

    window.toggle = function(wIdx, tIdx, checked) {
        state[activeTab][wIdx].tasks[tIdx].done = checked;
        const item = document.getElementById(`task-${wIdx}-${tIdx}`);
        if (checked) item.classList.add('completed');
        else item.classList.remove('completed');
        save();
        if (isFocusMode) {
            setTimeout(applyFocusMode, 300); // Small delay to let the user see it checked
        }
    };

    window.updateText = function(wIdx, tIdx, text) {
        state[activeTab][wIdx].tasks[tIdx].text = text;
        save();
    };

    window.updateDay = function(wIdx, tIdx, day) {
        state[activeTab][wIdx].tasks[tIdx].day = day;
        save();
    };

    window.updateWeekTitle = function(wIdx, title) {
        state[activeTab][wIdx].title = title;
        save();
    };

    window.updateWeekDates = function(wIdx, dates) {
        state[activeTab][wIdx].dates = dates;
        save();
    };

    // Add / Delete Tasks
    window.addTask = function(wIdx) {
        state[activeTab][wIdx].tasks.push({
            day: "Новий день",
            text: "Нова задача (натисніть щоб змінити)",
            done: false
        });
        save();
        renderWeek(wIdx);
        if (isFocusMode) applyFocusMode();
    };


    window.editLink = function(wIdx, tIdx) {
        const currentLink = state[activeTab][wIdx].tasks[tIdx].link || '';
        const newLink = prompt('Введіть посилання (URL):', currentLink);
        if (newLink !== null) {
            state[activeTab][wIdx].tasks[tIdx].link = newLink.trim();
            save();
            render();
            if (isFocusMode) applyFocusMode();
        }
    };

    window.copyTask = function(wIdx, tIdx) {
        const task = state[activeTab][wIdx].tasks[tIdx];
        navigator.clipboard.writeText(task.text).catch(err => {
            console.error('Failed to copy task', err);
        });
    };

    window.deleteTask = function(wIdx, tIdx) {
        if(confirm('Видалити цю задачу?')) {
            state[activeTab][wIdx].tasks.splice(tIdx, 1);
            save();
            renderWeek(wIdx);
            if (isFocusMode) applyFocusMode();
        }
    };

    // Drag and Drop Logic
    let dragSource = null;

    window.handleDragStart = function(e, wIdx, tIdx) {
        dragSource = { wIdx, tIdx };
        e.target.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
    };

    window.handleDragEnd = function(e) {
        e.target.classList.remove('dragging');
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    };

    window.handleDragOver = function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const li = e.target.closest('.task-item');
        if (li && !li.classList.contains('dragging')) {
            li.classList.add('drag-over');
        }
        return false;
    };

    window.handleDragLeave = function(e) {
        const li = e.target.closest('.task-item');
        if (li) li.classList.remove('drag-over');
    };

    window.handleDrop = function(e, targetWIdx, targetTIdx) {
        e.stopPropagation();
        const li = e.target.closest('.task-item');
        if (li) li.classList.remove('drag-over');
        
        if (!dragSource) return false;
        
        const { wIdx: sW, tIdx: sT } = dragSource;
        if (sW === targetWIdx && sT === targetTIdx) return false;

        const task = state[activeTab][sW].tasks.splice(sT, 1)[0];
        state[activeTab][targetWIdx].tasks.splice(targetTIdx, 0, task);
        
        save();
        if (sW === targetWIdx) {
            renderWeek(sW);
        } else {
            renderWeek(sW);
            renderWeek(targetWIdx);
        }
        if (isFocusMode) applyFocusMode();
        return false;
    };

    // Focus Mode Logic
    let isFocusMode = false;


    document.addEventListener('focusout', (e) => {
        if (window._pendingRender && !e.relatedTarget?.isContentEditable) {
            window._pendingRender = false;
            render();
            if (isFocusMode) applyFocusMode();
        }
    });

    window.toggleFocusMode = function() {
        isFocusMode = !isFocusMode;
        const btn = document.getElementById('focus-btn');
        if (isFocusMode) {
            btn.classList.add('active');
            applyFocusMode();
        } else {
            btn.classList.remove('active');
            document.body.classList.remove('focus-mode');
            render();
        }
    };

    function applyFocusMode() {
        document.body.classList.add('focus-mode');
        
        let foundW = -1;
        let foundT = -1;
        
        for (let w = 0; w < state[activeTab].length; w++) {
            for (let t = 0; t < state[activeTab][w].tasks.length; t++) {
                if (!state[activeTab][w].tasks[t].done) {
                    foundW = w;
                    foundT = t;
                    break;
                }
            }
            if (foundW !== -1) break;
        }
        
        document.querySelectorAll('.focused-week, .focused-task').forEach(el => {
            el.classList.remove('focused-week', 'focused-task');
        });
        
        if (foundW !== -1) {
            const weekEl = document.getElementById(`week-${foundW}`);
            const taskEl = document.getElementById(`task-${foundW}-${foundT}`);
            if (weekEl) weekEl.classList.add('focused-week');
            if (taskEl) taskEl.classList.add('focused-task');
        }
    }


    function calcProgress(week) {
        if (!week || !week.tasks) return 0;
        const total = week.tasks.length;
        const done = week.tasks.filter(t => t.done).length;
        return total > 0 ? Math.round((done / total) * 100) : 0;
    }

    function updateAllProgress() {
        state[activeTab].forEach((week, wIdx) => {
            const percent = calcProgress(week);
            
            const fill = document.getElementById(`fill-${wIdx}`);
            const stat = document.getElementById(`stat-${wIdx}`);
            
            if (fill && stat) {
                fill.style.width = `${percent}%`;
                stat.innerText = `${percent}%`;
            }
        });
    }

    init();
</script>
</body>
</html>
